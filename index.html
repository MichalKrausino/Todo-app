<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1 brání iOS auto-zoomu při fokusu pole (ten uměl
         nechat stránku zvětšenou a posouvatelnou do stran) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <!-- Jediná theme-color: režim si od téhle chvíle řídí appka (dá se
         v nastavení přepnout napevno), takže barvu stavového řádku
         přepisuje skript níž, ne media dotaz. -->
    <meta name="theme-color" content="#f4f4f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Stavový řádek na iPhonu. Hodnota se přepisuje skriptem níž podle
         režimu a NENÍ to kosmetika: s `default` si pruh nahoře kreslí iOS
         sám podle vzhledu SYSTÉMU, ne podle appky. Kdo má systém světlý
         a appku přepnutou na tmavou, kouká na bílý pruh nad černou appkou.
         Do appky iOS nevidí, takže jediná cesta, jak tam dostat její
         barvu, je nechat stránku kreslit až pod něj (`black-translucent`,
         proto `viewport-fit=cover` a `env(safe-area-inset-top)` v layoutu).
         Přepíná se to jen do tmavého režimu: `black-translucent` píše text
         hodin bíle a na světlém papíře by zmizel. Když by iOS dynamickou
         hodnotu nevzal, zůstane `default`, tedy dnešní stav — tahle změna
         nemá jak nic zhoršit. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Todo" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Todo</title>
    <!-- Režim se musí vyřešit dřív, než se cokoli vykreslí — jinak by
         tmavá appka na okamžik problikla bíle. Proto je to tady jako
         obyčejný skript v hlavičce, ne až v Reactu. Zdroj pravdy je
         `src/lib/theme.ts`, tohle je jen jeho ranní ozvěna. -->
    <script>
      (function () {
        try {
          var volba = localStorage.getItem('todo.theme') || 'system'
          var tmavy =
            volba === 'dark' ||
            (volba !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = tmavy ? 'dark' : 'light'
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', tmavy ? '#0e0e11' : '#f4f4f1')
          var lista = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')
          if (lista) lista.setAttribute('content', tmavy ? 'black-translucent' : 'default')
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
