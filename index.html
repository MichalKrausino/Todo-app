<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1 brání iOS auto-zoomu při fokusu pole (ten uměl
         nechat stránku zvětšenou a posouvatelnou do stran) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- default + theme-color: stavový řádek přebírá barvu pozadí appky
         v obou režimech (black-translucent by nutil bílý text i na světlé) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Todo" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Todo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
