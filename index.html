<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1 brání iOS auto-zoomu při fokusu pole (ten uměl
         nechat stránku zvětšenou a posouvatelnou do stran) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <!-- Jediná theme-color: režim si od téhle chvíle řídí appka (dá se
         v nastavení přepnout napevno), takže barvu stavového řádku
         přepisuje skript níž, ne media dotaz. -->
    <meta name="theme-color" content="#f6f6f4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- default + theme-color: stavový řádek přebírá barvu pozadí appky
         v obou režimech (black-translucent by nutil bílý text i na světlé) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Todo" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Todo</title>
    <!-- Režim se musí vyřešit dřív, než se cokoli vykreslí — jinak by
         tmavá appka na okamžik problikla bíle. Proto je to tady jako
         obyčejný skript v hlavičce, ne až v Reactu. Zdroj pravdy je
         `src/lib/theme.ts`, tohle je jen jeho ranní ozvěna. -->
    <script>
      (function () {
        try {
          var volba = localStorage.getItem('todo.theme') || 'system'
          var tmavy =
            volba === 'dark' ||
            (volba !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = tmavy ? 'dark' : 'light'
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', tmavy ? '#0e0e11' : '#f6f6f4')
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
