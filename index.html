<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1 brání iOS auto-zoomu při fokusu pole (ten uměl
         nechat stránku zvětšenou a posouvatelnou do stran) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <!-- theme-color ani styl stavového řádku tu NEJSOU napevno — píše je
         skript níž do proudu parseru. Proč, viz jeho komentář. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Todo" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Todo</title>
    <!-- Režim se musí vyřešit dřív, než se cokoli vykreslí — jinak by
         tmavá appka na okamžik problikla bíle. Proto je to tady jako
         obyčejný skript v hlavičce, ne až v Reactu. Zdroj pravdy je
         `src/lib/theme.ts`, tohle je jen jeho ranní ozvěna.

         Obě značky se PÍŠOU do proudu parseru (`document.write`), ne
         přepisují po něm — a to je celý vtip. iOS je čte při parsování
         hlavičky, takže pozdější `setAttribute` už nevidí. Změřeno na
         telefonu třikrát: pruh nahoře šel pokaždé za vzhledem SYSTÉMU,
         i když skript hned po parsování nastavil `black-translucent`.
         Vypadalo to, že tmavý režim jednou „funguje", ale to byla jen
         shoda — systém byl tehdy taky tmavý. Zapsaná značka je pro
         parser totéž co napsaná v HTML, jen se hodnota rozhodne až tady.

         `black-translucent` = pruh je průhledný a kreslí ho stránka svým
         papírem (proto `viewport-fit=cover` a `env(safe-area-inset-top)`
         v layoutu); hodiny píše iOS bíle, což na tmavém papíři sedí.
         Ve světlém režimu se značka NEPÍŠE vůbec: bílé hodiny by na
         světlém papíře zmizely, a bez ní si pruh vezme barvu z
         `theme-color`, tedy z papíru. -->
    <script>
      (function () {
        var tmavy = false
        try {
          var volba = localStorage.getItem('todo.theme') || 'system'
          tmavy =
            volba === 'dark' ||
            (volba !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        } catch (e) {
          // soukromé okno bez localStorage — zbyde světlý režim
        }
        document.documentElement.dataset.theme = tmavy ? 'dark' : 'light'
        document.write(
          '<meta name="theme-color" content="' + (tmavy ? '#0e0e11' : '#f4f4f1') + '">',
        )
        if (tmavy) {
          document.write(
            '<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">',
          )
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
